name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Dependencies
        working-directory: ./android-app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: ./android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IcescriptPlayer-Capacitor-Debug-APK
          path: android-app/android/app/build/outputs/apk/debug/*.apk
